<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>ログイン｜成功の原理を学ぶコース</title>
<style>
:root{
  --paper:#FCFBF8;--ink:#1B1E21;
  --indigo:#21456E;--indigo-2:#3D6797;--indigo-pale:#E7EDF4;
  --vermilion:#C0453B;--marker:#F7E96B;--muted:#6A7078;--rule:#D9D5CB;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
  --gothic:"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--gothic);color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%,#EAF0F7 0%,transparent 60%),
    linear-gradient(180deg,#F6F3EC,#EDE8DA);
  display:flex;align-items:center;justify-content:center;padding:1.2rem;min-height:100dvh
}
.card{
  width:100%;max-width:420px;background:var(--paper);
  border:1px solid var(--rule);border-radius:18px;
  box-shadow:0 10px 40px rgba(33,69,110,.14);
  padding:2.4rem 1.8rem 2rem;text-align:center
}
.badge{
  width:56px;height:56px;margin:0 auto 1.1rem;border-radius:50%;
  background:var(--indigo);display:flex;align-items:center;justify-content:center
}
.badge svg{display:block}
.eyebrow{
  font-family:var(--gothic);font-size:.68rem;letter-spacing:.28em;
  color:var(--vermilion);font-weight:700;margin:0 0 .4rem
}
h1{
  font-family:var(--mincho);font-size:1.32rem;letter-spacing:.06em;
  margin:0 0 .5rem;color:var(--indigo);line-height:1.5
}
.lead{font-size:.86rem;color:var(--muted);line-height:1.7;margin:0 0 1.6rem}
.field{text-align:left;margin-bottom:1rem}
label{display:block;font-size:.76rem;color:var(--indigo);font-weight:700;letter-spacing:.08em;margin-bottom:.4rem}
.pw-row{position:relative;display:flex;align-items:center}
input[type=password],input[type=text]{
  width:100%;padding:.85rem 2.6rem .85rem .95rem;font-size:1.05rem;
  font-family:var(--gothic);color:var(--ink);
  border:1.5px solid var(--rule);border-radius:11px;background:#fff;
  transition:border-color .2s,box-shadow .2s
}
input:focus{outline:none;border-color:var(--indigo-2);box-shadow:0 0 0 3px rgba(61,103,151,.18)}
.toggle-eye{
  position:absolute;right:.5rem;border:none;background:none;cursor:pointer;
  padding:.4rem;color:var(--muted);line-height:0;border-radius:8px
}
.toggle-eye:hover{color:var(--indigo)}
button.enter{
  width:100%;padding:.9rem;font-size:1rem;font-family:var(--gothic);font-weight:700;
  letter-spacing:.08em;color:#fff;background:var(--indigo);
  border:none;border-radius:11px;cursor:pointer;transition:background .2s,transform .05s
}
button.enter:hover{background:var(--indigo-2)}
button.enter:active{transform:translateY(1px)}
.error{
  min-height:1.3rem;margin:.7rem 0 0;font-size:.8rem;color:var(--vermilion);
  font-weight:700;opacity:0;transition:opacity .2s
}
.error.show{opacity:1}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.foot{margin-top:1.6rem;font-size:.72rem;color:var(--muted);letter-spacing:.04em;line-height:1.6}
.remember{display:flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--muted);margin:.2rem 0 1.2rem;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;accent-color:var(--indigo);cursor:pointer}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <rect x="5" y="10" width="14" height="10" rx="2.4" fill="#F7E96B"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2" fill="none"/>
        <circle cx="12" cy="15" r="1.6" fill="#21456E"/>
      </svg>
    </div>
    <p class="eyebrow">MEMBERS ONLY</p>
    <h1>成功の原理を学ぶコース</h1>
    <p class="lead">この教材は限定公開です。<br>合言葉を入力してお進みください。</p>

    <div class="field">
      <label for="pw">合言葉（パスワード）</label>
      <div class="pw-row">
        <input type="password" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="パスワードを入力" />
        <button type="button" class="toggle-eye" id="eye" aria-label="パスワードを表示">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
        </button>
      </div>
    </div>

    <label class="remember"><input type="checkbox" id="remember" checked> このブラウザで次回から省略する</label>

    <button class="enter" id="enterBtn">入 る</button>
    <p class="error" id="err">合言葉が違います。もう一度お試しください。</p>

    <p class="foot">ご不明な場合は、教材の配布元までお問い合わせください。</p>
  </main>

<script>
(function(){
  // ==== 設定 ====
  var PASSWORD = "ATS";          // 合言葉
  var TARGET   = "kyozai.html";  // 入ったあとに開くページ
  var KEY      = "kyozai_auth";  // 認証フラグの保存名
  // ================

  var pw=document.getElementById('pw');
  var btn=document.getElementById('enterBtn');
  var err=document.getElementById('err');
  var card=document.getElementById('card');
  var eye=document.getElementById('eye');
  var remember=document.getElementById('remember');

  // すでに認証済みなら素通り
  try{
    if(sessionStorage.getItem(KEY)==='1' || localStorage.getItem(KEY)==='1'){
      location.replace(TARGET);
      return;
    }
  }catch(e){}

  function tryEnter(){
    if(pw.value === PASSWORD){
      try{
        sessionStorage.setItem(KEY,'1');
        if(remember.checked) localStorage.setItem(KEY,'1');
      }catch(e){}
      location.href=TARGET;
    }else{
      err.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth;      // アニメ再生のリセット
      card.classList.add('shake');
      pw.select();
    }
  }

  btn.addEventListener('click',tryEnter);
  pw.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ tryEnter(); }
    else { err.classList.remove('show'); }
  });

  eye.addEventListener('click',function(){
    pw.type = pw.type==='password' ? 'text' : 'password';
    pw.focus();
  });

  pw.focus();
})();
</script>
</body>
</html>
